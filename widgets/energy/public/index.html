<html>

<head>
	<link rel="stylesheet" href="style.css" />
</head>

<body class="homey-widget">
	<canvas id="canvas1"></canvas>
	<canvas id="canvas2"></canvas>
	<canvas id="canvas3"></canvas>
	<canvas id="canvas4"></canvas>
	<canvas id="canvas5"></canvas>
	<canvas id="canvas6"></canvas>
	<canvas id="canvas7"></canvas>
	<canvas id="canvas8"></canvas>
	<canvas id="canvas9"></canvas>

	<script type="text/javascript">
		let pendingWidgetResult = null;
		let latestWidgetResult = null;
		let requestInitialWidgetState = null;

		function getDeviceSettings(settings)
		{
			return {
				solarDeviceId: settings && settings.solarDevices ? settings.solarDevices.id : null,
				batteryDeviceId: settings && settings.batteryDevices ? settings.batteryDevices.id : null,
				gridDeviceId: settings && settings.gridDevices ? settings.gridDevices.id : null,
				homeDeviceId: settings && settings.homeDevices ? settings.homeDevices.id : null,
			};
		}

		function isWidgetReady()
		{
			return isWidgetCanvasReady() && Boolean(window.PANEL);
		}

		function isWidgetCanvasReady()
		{
			return Boolean(window.flowFieldSolarText
				&& window.flowFieldBatteryText
				&& window.flowFieldGridText
				&& window.flowFieldHomeText
				&& window.flowFieldSolar
				&& window.flowFieldBattery
				&& window.flowFieldGrid
				&& window.flowFieldHome
				&& window.flowFieldHomey);
		}

		function flushPendingWidgetResult()
		{
			if (!pendingWidgetResult || !isWidgetReady())
			{
				return;
			}

			try
			{
				ensureLatestResult();

				// Merge partial API payload into the latest in-memory state so we
				// do not lose realtime-only values between refreshes/rebuilds.
				if (pendingWidgetResult.solar)
				{
					latestWidgetResult.solar = { ...latestWidgetResult.solar, ...pendingWidgetResult.solar };
				}
				if (pendingWidgetResult.battery)
				{
					latestWidgetResult.battery = { ...latestWidgetResult.battery, ...pendingWidgetResult.battery };
				}
				if (pendingWidgetResult.grid)
				{
					latestWidgetResult.grid = { ...latestWidgetResult.grid, ...pendingWidgetResult.grid };
				}
				if (pendingWidgetResult.home)
				{
					latestWidgetResult.home = { ...latestWidgetResult.home, ...pendingWidgetResult.home };
				}

				updateWidget(latestWidgetResult);
				pendingWidgetResult = null;
			}
			catch (err)
			{
				console.error('flushPendingWidgetResult failed:', err);
			}
		}

		window.addEventListener('energyWidgetReady', function ()
		{
			if (!pendingWidgetResult && latestWidgetResult)
			{
				pendingWidgetResult = latestWidgetResult;
			}
			flushPendingWidgetResult();
		});

		function refreshAfterVisibilityChange()
		{
			if (document.hidden)
			{
				return;
			}

			if (latestWidgetResult)
			{
				pendingWidgetResult = latestWidgetResult;
				flushPendingWidgetResult();
			}

			if (requestInitialWidgetState)
			{
				requestInitialWidgetState();
			}
		}

		document.addEventListener('visibilitychange', refreshAfterVisibilityChange);
		window.addEventListener('pageshow', refreshAfterVisibilityChange);

		function ensureLatestResult()
		{
			if (!latestWidgetResult)
			{
				latestWidgetResult = { solar: {}, battery: {}, grid: {}, home: {} };
			}
		}

		function onHomeyReady(Homey)
		{
			Homey.ready();

			const settings = Homey.getSettings();
			const deviceSettings = getDeviceSettings(settings);
			const height = settings.height || 200;
			Homey.setHeight(height);

			requestInitialWidgetState = () => Homey.api('GET', `/?solarDeviceId=${deviceSettings.solarDeviceId || ''}&batteryDeviceId=${deviceSettings.batteryDeviceId || ''}&gridDeviceId=${deviceSettings.gridDeviceId || ''}&homeDeviceId=${deviceSettings.homeDeviceId || ''}`, {})
				.then((result) =>
				{
					pendingWidgetResult = result;
					flushPendingWidgetResult();
				})
				.catch(console.error);

			requestInitialWidgetState();

			// Mobile webview startup can race module/canvas setup; retry shortly after open.
			setTimeout(() =>
			{
				if (requestInitialWidgetState)
				{
					requestInitialWidgetState();
				}
			}, 300);

			Homey.on('updateWidget', function ({ deviceId, capabilityID, value })
			{
				const settings = Homey.getSettings();
				const eventDeviceSettings = getDeviceSettings(settings);

				if (!isWidgetReady())
				{
					return;
				}

				// Keep latestWidgetResult in sync so rebuilds restore the latest live values,
				// not the stale initial API snapshot.
				ensureLatestResult();

				if (eventDeviceSettings.solarDeviceId === deviceId)
				{
					if (capabilityID === 'measure_power')
					{
						latestWidgetResult.solar.power = value;
						setPanelPowerValue(PANEL.SOLAR, value, 'W');
						flowFieldSolarText.draw();
					}
					else if (capabilityID === 'meter_power.today')
					{
						latestWidgetResult.solar.export = value;
						setPanelFromDeviceValue(PANEL.SOLAR, value, 'kW/h');
						flowFieldSolarText.draw();
					}
				}
				else if (eventDeviceSettings.batteryDeviceId === deviceId)
				{
					if (capabilityID === 'measure_power')
					{
						latestWidgetResult.battery.power = value;
						setPanelPowerValue(PANEL.BATTERY, value, 'W');
						flowFieldBatteryText.draw();
					}
					else if (capabilityID === 'measure_battery')
					{
						latestWidgetResult.battery.level = value;
						setChargeValue(PANEL.BATTERY, value, '%');
						flowFieldBatteryText.draw();
					}
					else if (capabilityID === 'meter_power.charge_today')
					{
						latestWidgetResult.battery.import = value;
						setPanelToDeviceValue(PANEL.BATTERY, value, 'kW/h');
						flowFieldBatteryText.draw();
					}
					else if (capabilityID === 'meter_power.discharge_today')
					{
						latestWidgetResult.battery.export = value;
						setPanelFromDeviceValue(PANEL.BATTERY, value, 'kW/h');
						flowFieldBatteryText.draw();
					}
				}
				else if (eventDeviceSettings.gridDeviceId === deviceId)
				{
					if (capabilityID === 'measure_power')
					{
						latestWidgetResult.grid.power = value;
						setPanelPowerValue(PANEL.POWER_GRID, value, 'W');
						flowFieldGridText.draw();
					}
					else if (capabilityID === 'meter_power.today_import')
					{
						latestWidgetResult.grid.import = value;
						setPanelFromDeviceValue(PANEL.POWER_GRID, value, 'kW/h');
						flowFieldGridText.draw();
					}
					else if (capabilityID === 'meter_power.today_export')
					{
						latestWidgetResult.grid.export = value;
						setPanelToDeviceValue(PANEL.POWER_GRID, value, 'kW/h');
						flowFieldGridText.draw();
					}
				}
				else if (eventDeviceSettings.homeDeviceId === deviceId)
				{
					if (capabilityID === 'measure_power.consumption')
					{
						latestWidgetResult.home.power = value;
						setPanelPowerValue(PANEL.HOME, value, 'W');
						flowFieldHomeText.draw();
					}
					else if (capabilityID === 'meter_power.today_consumption')
					{
						latestWidgetResult.home.import = value;
						setPanelToDeviceValue(PANEL.HOME, value, 'kW/h');
						flowFieldHomeText.draw();
					}
				}
			});
		}
	</script>

	<script type="module" src="script.js"></script>
	<script type="module">
		import { PANEL } from './animation.js';

		window.PANEL = PANEL;
		window.dispatchEvent(new Event('energyWidgetReady'));
	</script>

	<script type="text/javascript">
		function isFiniteNumber(value)
		{
			return (typeof value === 'number') && Number.isFinite(value);
		}

		function updateWidget(result)
		{
			if (!result || !window.PANEL)
			{
				return;
			}

			const solar = result.solar || {};
			const battery = result.battery || {};
			const grid = result.grid || {};
			const home = result.home || {};

			if (isFiniteNumber(solar.power))
			{
				setPanelPowerValue(PANEL.SOLAR, solar.power, 'W');
			}
			if (isFiniteNumber(solar.export))
			{
				setPanelFromDeviceValue(PANEL.SOLAR, solar.export, 'kW/h');
			}
			flowFieldSolarText.draw();

			if (isFiniteNumber(battery.power))
			{
				setPanelPowerValue(PANEL.BATTERY, battery.power, 'W');
			}
			if (isFiniteNumber(battery.export))
			{
				setPanelFromDeviceValue(PANEL.BATTERY, battery.export, 'kW/h');
			}
			if (isFiniteNumber(battery.import))
			{
				setPanelToDeviceValue(PANEL.BATTERY, battery.import, 'kW/h');
			}
			if (isFiniteNumber(battery.level))
			{
				setChargeValue(PANEL.BATTERY, battery.level, '%');
			}
			flowFieldBatteryText.draw();

			if (isFiniteNumber(grid.power))
			{
				setPanelPowerValue(PANEL.POWER_GRID, grid.power, 'W');
			}
			if (isFiniteNumber(grid.export))
			{
				setPanelToDeviceValue(PANEL.POWER_GRID, grid.export, 'kW/h');
			}
			if (isFiniteNumber(grid.import))
			{
				setPanelFromDeviceValue(PANEL.POWER_GRID, grid.import, 'kW/h');
			}
			flowFieldGridText.draw();

			if (isFiniteNumber(home.power))
			{
				setPanelPowerValue(PANEL.HOME, home.power, 'W');
			}
			if (isFiniteNumber(home.import))
			{
				setPanelToDeviceValue(PANEL.HOME, home.import, 'kW/h');
			}
			flowFieldHomeText.draw();
		}

		function setPanelPowerValue(panel, value, unit)
		{
			if ((panel === PANEL.SOLAR) && flowFieldSolarText)
			{
				flowFieldSolarText.setPowerValue(value, unit);
				flowFieldSolar.setPowerValue(value);
				flowFieldHomey.setPowerValue(value);
			}
			else if ((panel === PANEL.POWER_GRID) && flowFieldGridText)
			{
				flowFieldGridText.setPowerValue(value, unit);
				flowFieldGrid.setPowerValue(value);
			}
			else if ((panel === PANEL.BATTERY) && flowFieldBatteryText)
			{
				flowFieldBatteryText.setPowerValue(value, unit);
				flowFieldBattery.setPowerValue(value);
			}
			else if ((panel === PANEL.HOME) && flowFieldHomeText)
			{
				flowFieldHomeText.setPowerValue(value, unit);
				flowFieldHome.setPowerValue(value);
			}
		}

		function setPanelToDeviceValue(panel, value, unit)
		{
			if ((panel === PANEL.SOLAR) && flowFieldSolarText)
			{
				flowFieldSolarText.setToDeviceValue(value, unit);
			}
			else if ((panel === PANEL.POWER_GRID) && flowFieldGridText)
			{
				flowFieldGridText.setToDeviceValue(value, unit);
			}
			else if ((panel === PANEL.BATTERY) && flowFieldBatteryText)
			{
				flowFieldBatteryText.setToDeviceValue(value, unit);
			}
			else if ((panel === PANEL.HOME) && flowFieldHomeText)
			{
				flowFieldHomeText.setToDeviceValue(value, unit);
			}
		}

		function setPanelFromDeviceValue(panel, value, unit)
		{
			if ((panel === PANEL.SOLAR) && flowFieldSolarText)
			{
				flowFieldSolarText.setFromDeviceValue(value, unit);
			}
			else if ((panel === PANEL.POWER_GRID) && flowFieldGridText)
			{
				flowFieldGridText.setFromDeviceValue(value, unit);
			}
			else if ((panel === PANEL.BATTERY) && flowFieldBatteryText)
			{
				flowFieldBatteryText.setFromDeviceValue(value, unit);
			}
			else if ((panel === PANEL.HOME) && flowFieldHomeText)
			{
				flowFieldHomeText.setFromDeviceValue(value, unit);
			}
		}

		function setChargeValue(panel, value, unit)
		{
			if ((panel === PANEL.BATTERY) && flowFieldBatteryText)
			{
				flowFieldBatteryText.setChargeValue(value, unit);
				flowFieldBattery.setChargeValue(value);
				flowFieldHomey.setChargeValue(value);
			}
		}
	</script>

</body>

</html>
