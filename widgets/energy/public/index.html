<html>

<head>
	<link rel="stylesheet" href="style.css" />
</head>

<body class="homey-widget">
	<canvas id="canvas1"></canvas>
	<canvas id="canvas2"></canvas>
	<canvas id="canvas3"></canvas>
	<canvas id="canvas4"></canvas>
	<canvas id="canvas5"></canvas>
	<canvas id="canvas6"></canvas>
	<canvas id="canvas7"></canvas>
	<canvas id="canvas8"></canvas>
	<canvas id="canvas9"></canvas>

	<script type="text/javascript">
		let pendingWidgetResult = null;

		function isWidgetCanvasReady()
		{
			return Boolean(window.flowFieldSolarText
				&& window.flowFieldBatteryText
				&& window.flowFieldGridText
				&& window.flowFieldHomeText
				&& window.flowFieldSolar
				&& window.flowFieldBattery
				&& window.flowFieldGrid
				&& window.flowFieldHome
				&& window.flowFieldHomey);
		}

		function flushPendingWidgetResult()
		{
			if (!pendingWidgetResult || !isWidgetCanvasReady())
			{
				return;
			}

			updateWidget(pendingWidgetResult);
			pendingWidgetResult = null;
		}

		window.addEventListener('energyWidgetReady', function ()
		{
			flushPendingWidgetResult();
		});

		function onHomeyReady(Homey)
		{
			Homey.ready();

			const settings = Homey.getSettings();
			const height = settings.height || 200;
			Homey.setHeight(height);

			Homey.api('GET', `/?solarDeviceId=${settings.solarDevices.id}&batteryDeviceId=${settings.batteryDevices.id}&gridDeviceId=${settings.gridDevices.id}&homeDeviceId=${settings.homeDevices.id}`, {})
				.then((result) =>
				{
					pendingWidgetResult = result;
					flushPendingWidgetResult();
				})
				.catch(console.error);

			Homey.on('updateWidget', function ({ deviceId, capabilityID, value })
			{
				const settings = Homey.getSettings();
				if (settings.solarDevices.id === deviceId)
				{
					if (capabilityID === 'measure_power')
					{
						setPanelPowerValue(PANEL.SOLAR, value, 'W');
						flowFieldSolarText.draw();
					}
					else if (capabilityID === 'meter_power.today')
					{
						setPanelFromDeviceValue(PANEL.SOLAR, value, 'kW/h');
						flowFieldSolarText.draw();
					}
				}
				else if (settings.batteryDevices.id === deviceId)
				{
					if (capabilityID === 'measure_power')
					{
						setPanelPowerValue(PANEL.BATTERY, value, 'W');
						flowFieldBatteryText.draw();
					}
					else if (capabilityID === 'measure_battery')
					{
						setChargeValue(PANEL.BATTERY, value, '%');
						flowFieldBatteryText.draw();
					}
					else if (capabilityID === 'meter_power.charge_today')
					{
						setPanelToDeviceValue(PANEL.BATTERY, value, 'kW/h');
						flowFieldBatteryText.draw();
					}
					else if (capabilityID === 'meter_power.discharge_today')
					{
						setPanelFromDeviceValue(PANEL.BATTERY, value, 'kW/h');
						flowFieldBatteryText.draw();
					}
				}
				else if (settings.gridDevices.id === deviceId)
				{
					if (capabilityID === 'measure_power')
					{
						setPanelPowerValue(PANEL.POWER_GRID, value, 'W');
						flowFieldGridText.draw();
					}
					else if (capabilityID === 'meter_power.today_import')
					{
						setPanelFromDeviceValue(PANEL.POWER_GRID, value, 'kW/h');
						flowFieldGridText.draw();
					}
					else if (capabilityID === 'meter_power.today_export')
					{
						setPanelToDeviceValue(PANEL.POWER_GRID, value, 'kW/h');
						flowFieldGridText.draw();
					}
				}
				else if (settings.homeDevices.id === deviceId)
				{
					if (capabilityID === 'measure_power.consumption')
					{
						setPanelPowerValue(PANEL.HOME, value, 'W');
						flowFieldHomeText.draw();
					}
					else if (capabilityID === 'meter_power.today_consumption')
					{
						setPanelToDeviceValue(PANEL.HOME, value, 'kW/h');
						flowFieldHomeText.draw();
					}
				}
			});
		}
	</script>

	<script type="module" src="script.js"></script>
	<script type="module">
		import { PANEL } from './animation.js';

		// Make PANEL available globally
		window.PANEL = PANEL;
	</script>

	<script type="text/javascript">
		function updateWidget(result)
		{
			if (!result)
			{
				return;
			}

			setPanelPowerValue(PANEL.SOLAR, result.solar.power, 'W');
			setPanelFromDeviceValue(PANEL.SOLAR, result.solar.export, 'kW/h');
			flowFieldSolarText.draw();

			setPanelPowerValue(PANEL.BATTERY, result.battery.power, 'W');
			setPanelFromDeviceValue(PANEL.BATTERY, result.battery.export, 'kW/h'); // Updated to use setPanelExportedValue
			setPanelToDeviceValue(PANEL.BATTERY, result.battery.import, 'kW/h');
			setChargeValue(PANEL.BATTERY, result.battery.level, '%');
			flowFieldBatteryText.draw();

			setPanelPowerValue(PANEL.POWER_GRID, result.grid.power, 'W');
			setPanelToDeviceValue(PANEL.POWER_GRID, result.grid.export, 'kW/h');
			setPanelFromDeviceValue(PANEL.POWER_GRID, result.grid.import, 'kW/h'); // Added to handle exported value for POWER_GRID
			flowFieldGridText.draw(); // Added to redraw the home panel

			setPanelPowerValue(PANEL.HOME, result.home.power, 'W');
			setPanelToDeviceValue(PANEL.HOME, result.home.import, 'kW/h');
			flowFieldHomeText.draw(); // Added to redraw the home panel after updating values
		}

		function setPanelPowerValue(panel, value, unit)
		{
			if ((panel === PANEL.SOLAR) && flowFieldSolarText)
			{
				flowFieldSolarText.setPowerValue(value, unit);
				flowFieldSolar.setPowerValue(value);
				flowFieldHomey.setPowerValue(value);
			}
			else if ((panel === PANEL.POWER_GRID) && flowFieldGridText)
			{
				flowFieldGridText.setPowerValue(value, unit); // Updated to use setPowerValue
				flowFieldGrid.setPowerValue(value);
			}
			else if ((panel === PANEL.BATTERY) && flowFieldBatteryText)
			{
				flowFieldBatteryText.setPowerValue(value, unit); // Updated to use setPowerValue
				flowFieldBattery.setPowerValue(value); // Updated to use setPowerValue
			}
			else if ((panel === PANEL.HOME) && flowFieldHomeText)
			{
				flowFieldHomeText.setPowerValue(value, unit); // Updated to use setPowerValue
				flowFieldHome.setPowerValue(value); // Updated to use setPowerValue
			}
		}

		function setPanelToDeviceValue(panel, value, unit)
		{
			if ((panel === PANEL.SOLAR) && flowFieldSolarText)
			{
				flowFieldSolarText.setToDeviceValue(value, unit);
			}
			else if ((panel === PANEL.POWER_GRID) && flowFieldGridText)
			{
				flowFieldGridText.setToDeviceValue(value, unit);
			}
			else if ((panel === PANEL.BATTERY) && flowFieldBatteryText)
			{
				flowFieldBatteryText.setToDeviceValue(value, unit);
			}
			else if ((panel === PANEL.HOME) && flowFieldHomeText)
			{
				flowFieldHomeText.setToDeviceValue(value, unit);
			}
		}

		function setPanelFromDeviceValue(panel, value, unit)
		{
			if ((panel === PANEL.SOLAR) && flowFieldSolarText)
			{
				flowFieldSolarText.setFromDeviceValue(value, unit);
			}
			else if ((panel === PANEL.POWER_GRID) && flowFieldGridText)
			{
				flowFieldGridText.setFromDeviceValue(value, unit);
			}
			else if ((panel === PANEL.BATTERY) && flowFieldBatteryText)
			{
				flowFieldBatteryText.setFromDeviceValue(value, unit);
			}
			else if ((panel === PANEL.HOME) && flowFieldHomeText)
			{
				flowFieldHomeText.setFromDeviceValue(value, unit);
			}
		}

		function setChargeValue(panel, value, unit)
		{
			// Only applies to the battery panel
			if ((panel === PANEL.BATTERY) && flowFieldBatteryText)
			{
				flowFieldBatteryText.setChargeValue(value, unit);
				flowFieldBattery.setChargeValue(value);
				flowFieldHomey.setChargeValue(value);
			}
		}
	</script>

</body>

</html>
