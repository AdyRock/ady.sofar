<!doctype html>
<html lang="en">

<head><meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sofar Settings</title>
	<link rel="stylesheet" type="text/css" href="lwsa.css">
	<link rel="stylesheet" type="text/css" href="busy_indicator.css">
	<style>
		label.a {
			display: inline-block;
			width: 200px;
			height: 15px;
			padding: 5px;
		}

		.mt-10-mb-10 {
			margin-top: 10px;
			margin-bottom: 10px;
		}

		.mt-8-mb-0 {
			margin-top: 8px;
			margin-bottom: 0;
		}

		.mt-8 {
			margin-top: 8px;
		}

		.no-wrap {
			white-space: nowrap;
		}

		.full-width-box {
			width: 100%;
			box-sizing: border-box;
		}

		.test-result {
			height: 160px;
		}

		.device-list {
			font-family: monospace;
		}

		.advanced {
			margin: 10px 0;
		}

		.dialog_div {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			height: 100%;
			width: 100%;
			z-index: 200;
			background-color: rgba(30, 30, 30, 0.5);
			overflow-y: auto;
		}

		.dialog_div.show {
			display: block;
		}

		.dialog_box {
			background-color: #fff;
			border-radius: 8px;
			margin: 20px auto;
			padding: 16px;
			max-width: 420px;
		}
	</style>

	<style type="text/css">
		.fog_div {
			display: none;
			position: fixed;
			top: 0px;
			left: 0px;
			height: 100%;
			width: 100%;
			z-index: 100;
			background-color: rgba(30, 30, 30, 0.5);
		}

		#busybox.show {
			display: block;
		}
	</style>

	<!-- The '/homey.js' script must be included in your settings view to work -->
	<script type="text/javascript" src="/homey.js" data-origin="settings"></script>
	<script type="text/javascript" src="busy_indicator.js"></script>
</head>

<body>
	<!-- Busy indicator -->
	<div id="busybox" class="fog_div">
		<div></div>
	</div>

	<!-- Tab links -->
	<div class="tab">
		<button class="tablinks" onclick="setPage(event, 'settings')" id="defaultOpen" title="Settings"><span data-i18n="settings.settingsTab"></span></button>
		<button class="tablinks" onclick="setPage(event, 'devices')" title="Devices"><span data-i18n="settings.devices"></span></button>
		<button class="tablinks" onclick="setPage(event, 'log')" title="Diagnostics Log"><span data-i18n="settings.diagnosticsLog"></span></button>
		<button class="tablinks" onclick="setPage(event, 'send')" title="Register Log"><span data-i18n="settings.registerLog"></span></button>
	</div>

	<!-- DEVICES PAGE - lists the manually configured devices and the actions that can be performed on them -->
	<div id="devices" class="tabcontent">
		<div class="field row">
			<label class="homey-form-label" for="manualDevices"><span data-i18n="settings.devicesList"></span></label>
			<select class="full-width-box device-list" id="manualDevices" size="10" title="Devices List"></select>
			<p class="mt-10-mb-10">
				<button class="homey-button-secondary-shadow" id="addDevice" title="Add"><span data-i18n="settings.addDevice"></span></button>
				<button class="homey-button-secondary-shadow" id="editDevice" title="Edit"><span data-i18n="settings.editDevice"></span></button>
				<button class="homey-button-secondary-shadow" id="testDevice" title="Test"><span data-i18n="settings.testDevice"></span></button>
				<button class="homey-button-secondary-shadow" id="removeDevice" title="Delete"><span data-i18n="settings.removeDevice"></span></button>
			</p>
			<p><span data-i18n="settings.devicesListHint"></span></p>
		</div>
	</div>

	<!-- LOG PAGE -->
	<div id="log" class="tabcontent">
			<div class="field row">
				<label class="homey-form-checkbox">
					<input class="homey-form-checkbox-input" id="logEnabled" type="checkbox" value="logEnabled" title="Enable Diagnostics Logging" />
					<span class="homey-form-checkbox-checkmark"></span>
					<span class="homey-form-checkbox-text"><span data-i18n="settings.logEnabled"></span></span>
				</label>
			</div>
		<div class="field row">
			<label class="homey-form-label"  for="email"><span data-i18n="settings.email"></span></label>
			<input class="homey-form-input" id="email" type="text" value="" title="Email" />
			<P></P>
		</div>
			<p><button class="homey-button-secondary-shadow" id="clearDiagLog" title="Clear Log"><span data-i18n="settings.clearLog"></span></button> <button class="homey-button-secondary-shadow" id="sendDiagLog" title="Send Log"><span data-i18n="settings.sendLog"></span></button></p>
			<div class="field row">
				<label class="homey-form-label"  for="diagLog"><span data-i18n="settings.logData"></span></label>
				<textarea id="diagLog" class="no-wrap" title="Log Data"></textarea>
			</div>
	</div>

	<!-- SETTINGS PAGE -->
	<div id="settings" class="tabcontent">
		<div class="field row">
			<label class="homey-form-label" for="pollingIntervalSeconds"><span data-i18n="settings.pollingInterval"></span></label>
			<input class="homey-form-input" id="pollingIntervalSeconds" type="number" min="10" max="3600" step="1" value="15" title="Polling Interval Seconds" />
			<p><span data-i18n="settings.pollingIntervalHint"></span></p>
		</div>
		<div class="field row">
			<label class="homey-form-label"><span data-i18n="settings.connectionMode"></span></label>
			<div class="homey-form-radio-set">
				<label class="homey-form-radio">
					<input class="homey-form-radio-input" name="connectionMode" id="connectionModeAuto" type="radio" value="auto" title="Automatic" />
					<span class="homey-form-radio-checkmark"></span>
					<span class="homey-form-radio-text"><span data-i18n="settings.connectionModeAuto"></span></span>
				</label>
				<label class="homey-form-radio">
					<input class="homey-form-radio-input" name="connectionMode" id="connectionModeManual" type="radio" value="manual" title="Manual" />
					<span class="homey-form-radio-checkmark"></span>
					<span class="homey-form-radio-text"><span data-i18n="settings.connectionModeManual"></span></span>
				</label>
			</div>
			<p><span data-i18n="settings.connectionModeHint"></span></p>
		</div>
		<div class="field row">
			<p class="mt-8"><button class="homey-button-primary-full" id="saveSettings" title="Save"><span data-i18n="settings.saveSettings"></span></button></p>
		</div>
	</div>

	<!--SEND COMMAND PAGE -->
	<div id="send" class="tabcontent">
		<h1>For debug use only</h1>
		<div class="field row">
			<label class="homey-form-label"  for="commandData"><span data-i18n="settings.readRegister"></span></label>
			<input class="homey-form-input" id="commandData" type="text" value="" title="Read Register" />

			<label class="homey-form-label"  for="commandDataNum"><span data-i18n="settings.readRegisterNum"></span></label>
			<input class="homey-form-input" id="commandDataNum" type="text" value="1" title="Read Register Number" />
			<P></P>
			<p><button class="homey-button-secondary-shadow" id="getRegisters" title="Send Command"><span data-i18n="settings.sendCommand"></span></button> <button class="homey-button-secondary-shadow" id="stop" title="Stop"><span data-i18n="settings.stop"></span></button> <button class="homey-button-secondary-shadow" id="clearRegisters" title="Clear Response"><span data-i18n="settings.clearResponse"></span></button></p>
		</div>
		<div class="field row">
			<label class="homey-form-label"  for="sendResponse"><span data-i18n="settings.response"></span></label>
			<textarea id="sendResponse" class="no-wrap" title="Response"></textarea>
		</div>
	</div>

	<!-- ADD DEVICE DIALOG -->
	<div id="addDeviceDialog" class="dialog_div">
		<div class="dialog_box">
			<h2 id="dialogTitle"></h2>
			<div class="field row">
				<label class="homey-form-label" for="dialogIp"><span data-i18n="settings.deviceIp"></span></label>
				<input class="homey-form-input" id="dialogIp" type="text" value="" title="IP Address" />
			</div>
			<div class="field row">
				<label class="homey-form-label" for="dialogSerial"><span data-i18n="settings.deviceSerial"></span></label>
				<input class="homey-form-input" id="dialogSerial" type="number" min="0" step="1" value="" title="Serial Number" />
			</div>
			<div class="field row">
				<label class="homey-form-label" for="dialogSlaveId"><span data-i18n="settings.modbusSlaveId"></span></label>
				<input class="homey-form-input" id="dialogSlaveId" type="number" min="1" max="247" step="1" value="1" title="Modbus Slave ID" />
			</div>
			<div class="field row">
				<label class="homey-form-label" for="dialogProtocol"><span data-i18n="settings.modbusProtocol"></span></label>
				<select class="homey-form-select full-width-box" id="dialogProtocol" title="Protocol">
					<option value="solarman" data-i18n="settings.modbusProtocolSolarman">Solarman V5</option>
					<option value="modbus_tcp" data-i18n="settings.modbusProtocolTcp">Plain MODBUS TCP</option>
				</select>
			</div>
			<div class="field row" id="dialogSolarmanPortRow">
				<label class="homey-form-label" for="dialogSolarmanPort"><span data-i18n="settings.solarmanPort"></span></label>
				<input class="homey-form-input" id="dialogSolarmanPort" type="number" min="1" max="65535" step="1" value="8899" title="Solarman V5 Port" />
			</div>
			<div class="field row" id="dialogTcpPortRow">
				<label class="homey-form-label" for="dialogTcpPort"><span data-i18n="settings.modbusTcpPort"></span></label>
				<input class="homey-form-input" id="dialogTcpPort" type="number" min="1" max="65535" step="1" value="502" title="Plain MODBUS TCP Port" />
			</div>
			<div class="field row" id="dialogConnectionReuseRow">
				<label class="homey-form-label" for="dialogConnectionReuse"><span data-i18n="settings.connectionReuse"></span></label>
				<select class="homey-form-select full-width-box" id="dialogConnectionReuse" title="Connection Handling">
					<option value="persistent" data-i18n="settings.connectionReusePersistent">Keep the connection open</option>
					<option value="per_request" data-i18n="settings.connectionReusePerRequest">New connection per request</option>
				</select>
			</div>
			<div class="field row">
				<label class="homey-form-label" for="dialogRegisterMap"><span data-i18n="settings.registerMap"></span></label>
				<select class="homey-form-select full-width-box" id="dialogRegisterMap" title="Register Map">
					<option value="sofar_lsw3">sofar_lsw3</option>
					<option value="sofar_g3hyd">sofar_g3hyd</option>
					<option value="sofar_ktlx_g">sofar_ktlx_g</option>
					<option value="sofar_hy_es">sofar_hy_es</option>
					<option value="solis_hybrid">solis_hybrid</option>
					<option value="sun3p">sun3p</option>
					<option value="deye_hybrid">deye_hybrid</option>
					<option value="deye_sg04lp3">deye_sg04lp3</option>
				</select>
			</div>
			<details class="advanced">
				<summary><span data-i18n="settings.advanced"></span></summary>
				<div class="field row">
					<label class="homey-form-label" for="dialogRetryCount"><span data-i18n="settings.retryCount"></span></label>
					<input class="homey-form-input" id="dialogRetryCount" type="number" min="0" max="10" step="1" value="2" title="Retry Count" />
				</div>
				<div class="field row">
					<label class="homey-form-label" for="dialogRequestDelay"><span data-i18n="settings.requestDelay"></span></label>
					<input class="homey-form-input" id="dialogRequestDelay" type="number" min="0" max="5000" step="10" value="100" title="Request Delay" />
				</div>
			</details>
			<p class="mt-10-mb-10">
				<button class="homey-button-primary-full" id="dialogSave" title="Save"></button>
				<button class="homey-button-secondary-shadow" id="dialogCancel" title="Cancel"><span data-i18n="settings.cancel"></span></button>
			</p>
		</div>
	</div>

	<!-- TEST RESULT DIALOG -->
	<div id="testResultDialog" class="dialog_div">
		<div class="dialog_box">
			<h2><span data-i18n="settings.testConnectionResult"></span></h2>
			<textarea id="testResult" class="no-wrap full-width-box test-result" readonly title="Test Result"></textarea>
			<p class="mt-10-mb-10"><button class="homey-button-primary-full" id="testResultClose" title="Close"><span data-i18n="settings.close"></span></button></p>
		</div>
	</div>

	<script type="text/javascript">
		// Create the busy indicator
		var busyi = new busy_indicator(document.getElementById("busybox"), document.querySelector("#busybox div"));

		var diagLogElement = document.getElementById('diagLog');
		var logEnabledElement = document.getElementById('logEnabled');
		var logNetEnabledElement = document.getElementById('logNetEnabled');

		var clearLogElement = document.getElementById('clearDiagLog');
		var sendDiagLogElement = document.getElementById('sendDiagLog');
		var manualDevicesElement = document.getElementById('manualDevices');
		var addDeviceElement = document.getElementById('addDevice');
		var removeDeviceElement = document.getElementById('removeDevice');

		// Send data tab
		var commandDataElement = document.getElementById('commandData');
		var commandDataNumElement = document.getElementById('commandDataNum');
		var getRegistersElement = document.getElementById('getRegisters');
		var clearRegistersElement = document.getElementById('clearRegisters');
		var sendResponseElement = document.getElementById('sendResponse');
		var stopElement = document.getElementById('stop');
		var pollingIntervalElement = document.getElementById('pollingIntervalSeconds');
		var connectionModeElements = document.getElementsByName('connectionMode');
		var saveSettingsElement = document.getElementById('saveSettings');

		// Manual devices tab
		var editDeviceElement = document.getElementById('editDevice');
		var testDeviceElement = document.getElementById('testDevice');

		// Add device dialog
		var addDeviceDialogElement = document.getElementById('addDeviceDialog');
		var dialogTitleElement = document.getElementById('dialogTitle');
		var dialogIpElement = document.getElementById('dialogIp');
		var dialogSerialElement = document.getElementById('dialogSerial');
		var dialogSlaveIdElement = document.getElementById('dialogSlaveId');
		var dialogProtocolElement = document.getElementById('dialogProtocol');
		var dialogSolarmanPortRowElement = document.getElementById('dialogSolarmanPortRow');
		var dialogSolarmanPortElement = document.getElementById('dialogSolarmanPort');
		var dialogTcpPortRowElement = document.getElementById('dialogTcpPortRow');
		var dialogTcpPortElement = document.getElementById('dialogTcpPort');
		var dialogConnectionReuseRowElement = document.getElementById('dialogConnectionReuseRow');
		var dialogConnectionReuseElement = document.getElementById('dialogConnectionReuse');
		var dialogRegisterMapElement = document.getElementById('dialogRegisterMap');
		var dialogRetryCountElement = document.getElementById('dialogRetryCount');
		var dialogRequestDelayElement = document.getElementById('dialogRequestDelay');
		var dialogSaveElement = document.getElementById('dialogSave');
		var dialogCancelElement = document.getElementById('dialogCancel');

		// Test result dialog
		var testResultDialogElement = document.getElementById('testResultDialog');
		var testResultElement = document.getElementById('testResult');
		var testResultCloseElement = document.getElementById('testResultClose');

		var itemDisplyType = "flex";
		var manualDevices = [];
		var editingDeviceIndex = -1;

		function clampNumber(value, defaultValue, minValue, maxValue)
		{
			var number = (value === null || value === undefined || value === '') ? NaN : Number(value);
			if (!Number.isFinite(number))
			{
				number = defaultValue;
			}

			return Math.max(minValue, Math.min(maxValue, Math.round(number)));
		}

		function describeDevice(device)
		{
			var protocol = device.protocol === 'modbus_tcp' ? 'MODBUS TCP' : 'Solarman V5';
			return device.ip + ':' + device.port + '  ' + protocol + '  SN ' + device.serial + '  ID ' + device.slaveId + '  ' + device.registerMap;
		}

		// Fills in the defaults for devices added by older app versions
		function normalizeDevice(device)
		{
			var protocol = (device && device.protocol === 'modbus_tcp') ? 'modbus_tcp' : 'solarman';

			return {
				ip: (device && device.ip) ? String(device.ip).trim() : '',
				serial: clampNumber(device ? device.serial : 0, 0, 0, 4294967295),
				slaveId: clampNumber(device ? device.slaveId : 1, 1, 1, 247),
				protocol: protocol,
				port: clampNumber(device ? device.port : 0, protocol === 'modbus_tcp' ? 502 : 8899, 1, 65535),
				registerMap: (device && device.registerMap) ? device.registerMap : 'auto',
				connectionReuse: (device && device.connectionReuse === 'per_request') ? 'per_request' : 'persistent',
				retryCount: clampNumber(device ? device.retryCount : 2, 2, 0, 10),
				requestDelayMs: clampNumber(device ? device.requestDelayMs : 100, 100, 0, 5000),
			};
		}

		function updateManualDevices(storedDevices)
		{
			manualDevices = (Array.isArray(storedDevices) ? storedDevices : [])
				.filter(function(device) { return device && device.ip; })
				.map(normalizeDevice);

			var selectedIndex = manualDevicesElement.selectedIndex;
			manualDevicesElement.innerHTML = '';

			manualDevices.forEach(function(device)
			{
				var option = document.createElement('option');
				option.text = describeDevice(device);
				manualDevicesElement.add(option);
			});

			if (selectedIndex >= 0 && selectedIndex < manualDevices.length)
			{
				manualDevicesElement.selectedIndex = selectedIndex;
			}
		}

		function showDialog(dialog, show)
		{
			dialog.className = show ? 'dialog_div show' : 'dialog_div';
		}

		function updateDialogProtocolFields()
		{
			var isModbusTcp = dialogProtocolElement.value === 'modbus_tcp';
			dialogSolarmanPortRowElement.style.display = isModbusTcp ? 'none' : '';
			dialogTcpPortRowElement.style.display = isModbusTcp ? '' : 'none';
			dialogConnectionReuseRowElement.style.display = isModbusTcp ? '' : 'none';
		}

		// a method named 'onHomeyReady' must be present in your code
		function onHomeyReady(Homey)
		{
			itemDisplyType = stopElement.style.display;
			stopElement.style.display = "none";

			Homey.get('debugMode', function(err, debugMode)
			{
				if (err) return Homey.alert(err);
				if (debugMode)
				{
					document.getElementById("send").style.visibility = 'visible';
				}
			});

			document.getElementById("defaultOpen").click();

			// Check if register logging is in progress
			Homey.api('GET', '/getRegisterLogging/', {}, function(err, result)
			{
				if (err)
				{
					return Homey.alert(err);
				}
				else
				{
					if (result === true)
					{
						stopElement.style.display = itemDisplyType;
						getRegistersElement.style.display = "none";
						clearRegistersElement.style.display = "none";
					}
				}
			});

			// Read the log data from the file in the /userdata directory
			Homey.api('GET', '/getRegisterLog/', {}, function(err, result)
			{
				if (err)
				{
					return Homey.alert(err);
				}
				else
				{
					sendResponseElement.value = result;
				}
			});

			Homey.on('ady.sofar.logupdated', function(data)
			{
				diagLogElement.value = data.log;
			});

			Homey.on('ady.sofar.regupdated', function(data)
			{
				waitCursor(false);

				sendResponseElement.value += `${data.result}`;
				if (data.result == "Finished")
				{
					sendResponseElement.value += "\n";
					stopElement.style.display = "none";
					getRegistersElement.style.display = itemDisplyType;
					clearRegistersElement.style.display = itemDisplyType;
				}
			});

			Homey.on('ady.sofar.testresult', function(data)
			{
				if (data.line)
				{
					var current = testResultElement.value;
					testResultElement.value = (current === Homey.__('settings.testing') || current === '') ? data.line : (current + '\n' + data.line);
					testResultElement.scrollTop = testResultElement.scrollHeight;
				}

				if (data.finished)
				{
					waitCursor(false);
				}
			});

			Homey.get('logEnabled', function(err, logEnabled)
			{
				if (err) return Homey.alert(err);
				logEnabledElement.checked = logEnabled;
			});

			Homey.get('manualSensors', function(err, storedDevices)
			{
				if (err) return Homey.alert(err);
				updateManualDevices(storedDevices);
			});

			function getSelectedRadioValue(elements, defaultValue)
			{
				for (var r = 0; r < elements.length; r++)
				{
					if (elements[r].checked)
					{
						return elements[r].value;
					}
				}

				return defaultValue;
			}

			function setSelectedRadioValue(elements, value, defaultValue)
			{
				var selected = defaultValue;
				for (var r = 0; r < elements.length; r++)
				{
					if (elements[r].value === value)
					{
						selected = value;
					}
				}

				for (var s = 0; s < elements.length; s++)
				{
					elements[s].checked = (elements[s].value === selected);
				}
			}

			Homey.get('pollingIntervalSeconds', function(err, value)
			{
				if (err) return Homey.alert(err);
				pollingIntervalElement.value = clampNumber(value, 15, 10, 3600);
			});

			Homey.get('connectionMode', function(err, value)
			{
				if (err) return Homey.alert(err);
				setSelectedRadioValue(connectionModeElements, value, 'auto');
			});

			function saveSettings()
			{
				var pollingIntervalSeconds = clampNumber(pollingIntervalElement.value, 15, 10, 3600);
				pollingIntervalElement.value = pollingIntervalSeconds;

				waitCursor(true);

				Homey.set('pollingIntervalSeconds', pollingIntervalSeconds, function(err)
				{
					if (err)
					{
						waitCursor(false);
						return Homey.alert(err);
					}

					Homey.set('connectionMode', getSelectedRadioValue(connectionModeElements, 'auto'), function(setErr)
					{
						waitCursor(false);
						if (setErr) return Homey.alert(setErr);
						Homey.alert(Homey.__('settings.settingsSaved'));
					});
				});
			}

			saveSettingsElement.addEventListener('click', function(e)
			{
				e.preventDefault();
				saveSettings();
			});

			function saveManualDevices(devices, onSaved)
			{
				Homey.set('manualSensors', devices, function(err)
				{
					if (err) return Homey.alert(err);
					updateManualDevices(devices);
					if (onSaved) onSaved();
				});
			}

			function getSelectedDevice()
			{
				var index = manualDevicesElement.selectedIndex;
				return (index >= 0 && index < manualDevices.length) ? manualDevices[index] : null;
			}

			// index of -1 opens the dialog for a new device, otherwise the selected device is edited in place
			function openDeviceDialog(index)
			{
				editingDeviceIndex = index;

				var device = (index >= 0) ? manualDevices[index] : normalizeDevice({ registerMap: 'sofar_lsw3' });

				dialogTitleElement.textContent = Homey.__(index >= 0 ? 'settings.editDeviceTitle' : 'settings.addDeviceTitle');
				dialogSaveElement.textContent = Homey.__(index >= 0 ? 'settings.save' : 'settings.addDevice');

				dialogIpElement.value = device.ip;
				dialogSerialElement.value = device.serial ? device.serial : '';
				dialogSlaveIdElement.value = device.slaveId;
				dialogProtocolElement.value = device.protocol;
				dialogSolarmanPortElement.value = (device.protocol === 'solarman') ? device.port : 8899;
				dialogTcpPortElement.value = (device.protocol === 'modbus_tcp') ? device.port : 502;
				dialogConnectionReuseElement.value = (device.protocol === 'modbus_tcp') ? device.connectionReuse : 'persistent';
				dialogRegisterMapElement.value = device.registerMap;
				if (!dialogRegisterMapElement.value)
				{
					dialogRegisterMapElement.selectedIndex = 0;
				}
				dialogRetryCountElement.value = device.retryCount;
				dialogRequestDelayElement.value = device.requestDelayMs;

				updateDialogProtocolFields();
				showDialog(addDeviceDialogElement, true);
			}

			addDeviceElement.addEventListener('click', function(e)
			{
				e.preventDefault();
				openDeviceDialog(-1);
			});

			editDeviceElement.addEventListener('click', function(e)
			{
				e.preventDefault();

				var index = manualDevicesElement.selectedIndex;
				if (index < 0 || index >= manualDevices.length)
				{
					return Homey.alert(Homey.__('settings.selectDeviceFirst'));
				}

				openDeviceDialog(index);
			});

			manualDevicesElement.addEventListener('dblclick', function()
			{
				var index = manualDevicesElement.selectedIndex;
				if (index >= 0 && index < manualDevices.length)
				{
					openDeviceDialog(index);
				}
			});

			dialogProtocolElement.addEventListener('change', updateDialogProtocolFields);

			dialogCancelElement.addEventListener('click', function(e)
			{
				e.preventDefault();
				showDialog(addDeviceDialogElement, false);
			});

			dialogSaveElement.addEventListener('click', function(e)
			{
				e.preventDefault();

				var ip = dialogIpElement.value.trim();
				if (!ip)
				{
					return Homey.alert(Homey.__('settings.deviceIpRequired'));
				}

				var protocol = dialogProtocolElement.value;
				var serial = clampNumber(dialogSerialElement.value, 0, 0, 4294967295);
				if ((protocol === 'solarman') && (serial === 0))
				{
					return Homey.alert(Homey.__('settings.deviceSerialRequired'));
				}

				var device = {
					ip: ip,
					serial: serial,
					slaveId: clampNumber(dialogSlaveIdElement.value, 1, 1, 247),
					protocol: protocol,
					port: (protocol === 'modbus_tcp') ? clampNumber(dialogTcpPortElement.value, 502, 1, 65535) : clampNumber(dialogSolarmanPortElement.value, 8899, 1, 65535),
					connectionReuse: dialogConnectionReuseElement.value,
					registerMap: dialogRegisterMapElement.value,
					retryCount: clampNumber(dialogRetryCountElement.value, 2, 0, 10),
					requestDelayMs: clampNumber(dialogRequestDelayElement.value, 100, 0, 5000),
				};

				var updatedDevices = manualDevices.slice();
				if (editingDeviceIndex >= 0)
				{
					updatedDevices[editingDeviceIndex] = device;
				}
				else
				{
					updatedDevices.push(device);
				}

				saveManualDevices(updatedDevices, function()
				{
					showDialog(addDeviceDialogElement, false);
				});
			});

			testDeviceElement.addEventListener('click', function(e)
			{
				e.preventDefault();

				var device = getSelectedDevice();
				if (!device)
				{
					return Homey.alert(Homey.__('settings.selectDeviceFirst'));
				}

				testResultElement.value = Homey.__('settings.testing');
				showDialog(testResultDialogElement, true);
				waitCursor(true);

				Homey.api('POST', '/testConnection/', device, function(err)
				{
					if (err)
					{
						waitCursor(false);
						testResultElement.value = (err.message || err);
					}
				});
			});

			testResultCloseElement.addEventListener('click', function(e)
			{
				e.preventDefault();
				showDialog(testResultDialogElement, false);
			});

			removeDeviceElement.addEventListener('click', function(e)
			{
				e.preventDefault();

				var index = manualDevicesElement.selectedIndex;
				if (index < 0 || index >= manualDevices.length)
				{
					return Homey.alert(Homey.__('settings.selectDeviceFirst'));
				}

				var updatedDevices = manualDevices.slice();
				updatedDevices.splice(index, 1);
				saveManualDevices(updatedDevices);
			});

			Homey.api('GET', '/getLog/',
			{
				notify: true
			}, function(err, result)
			{
				if (err)
				{
					return Homey.alert(err);
				}
				else
				{
					diagLogElement.value = result;
				}
			});

			logEnabledElement.addEventListener('click', function(e)
			{
				Homey.set('logEnabled', logEnabledElement.checked, function(err)
				{
					if (err) return Homey.alert(err);
				});
			});

			clearLogElement.addEventListener('click', function(e)
			{
				Homey.api('POST', '/clearLog/',
				{
					notify: true
				}, function(err, result)
				{
					if (err)
					{
						return Homey.alert(err);
					}
					else
					{
						diagLogElement.value = "";
					}
				});
			});

			sendDiagLogElement.addEventListener('click', function(e)
			{
				Homey.confirm(Homey.__('settings.confirmSend'), null, function(e, ok)
				{
					if (ok)
					{
						waitCursor(true);
						Homey.api('POST', '/sendLog/',
						{
							notify: true,
							logType: "diag"
						}, function(err, result)
						{
							waitCursor(false);
							if (err)
							{
								return Homey.alert(err);
							}
							else
							{
								return Homey.alert(result);
							}
						});
					}
				});
			});

			getRegistersElement.addEventListener('click', function(e)
			{
				waitCursor(true);
				stopElement.style.display = itemDisplyType;
				getRegistersElement.style.display = "none";
				clearRegistersElement.style.display = "none";

				Homey.api('POST', '/getRegisters/',
				{
					start: commandDataElement.value,
					count: commandDataNumElement.value,
				}, function(err, result)
				{
					if (err)
					{
						stopElement.style.display = "none";
						getRegistersElement.style.display = itemDisplyType;
						clearRegistersElement.style.display = itemDisplyType;
						waitCursor(false);
						return Homey.alert(err);
					}
					else
					{
						sendResponseElement.value += result;
					}
				});
			});

			stopElement.addEventListener('click', function(e)
			{
				Homey.api('POST', '/getRegisters/',
				{
					start: 'stop',
					count: 'stop',
				}, function(err, result)
				{
					waitCursor(false);
					if (err)
					{
						return Homey.alert(err);
					}
					else
					{
						sendResponseElement.value += result;
					}
				});
			});

			clearRegistersElement.addEventListener('click', function(e)
			{
				Homey.api('POST', '/getRegisters/',
				{
					start: 'clear',
					count: 'clear',
				}, function(err, result)
				{
					waitCursor(false);
					if (err)
					{
						return Homey.alert(err);
					}
					else
					{
						sendResponseElement.value = result;
					}
				});
			});

			// Tell Homey we're ready to be displayed
			Homey.ready();
		}

		function setPage(evt, tabPage)
		{
			var i, tabcontent, tablinks;

			// Get all elements with class="tabcontent" and hide them
			tabcontent = document.getElementsByClassName("tabcontent");
			for (i = 0; i < tabcontent.length; i++)
			{
				tabcontent[i].style.display = "none";
			}

			// Get all elements with class="tablinks" and remove the class "active"
			tablinks = document.getElementsByClassName("tablinks");
			for (i = 0; i < tablinks.length; i++)
			{
				tablinks[i].className = tablinks[i].className.replace(" active", "");
			}

			// Show the current tab, and add an "active" class to the button that opened the tab
			document.getElementById(tabPage).style.display = "block";
			evt.currentTarget.className += " active";

			if (tabPage == 'log')
			{
				// Refresh the log data
				Homey.get('logEnabled', function(err, logEnabled)
				{
					if (err) return Homey.alert(err);
					logEnabledElement.checked = logEnabled;
				});

				Homey.api('GET', '/getLog/', {}, function(err, result)
				{
					if (err) return Homey.alert(err);
					diagLogElement.value = result;
				});

				// Make the log text area fill the page
				diagLogElement.setAttribute('cols', diagLogElement.parentElement.clientWidth / 8);
				diagLogElement.style.height = (window.innerHeight - diagLogElement.offsetTop - 30) + 'px';
			}
			else if (tabPage == 'send')
			{
				// Make the simulator text box fill the page
				sendResponseElement.setAttribute('cols', sendResponseElement.parentElement.clientWidth / 7.9);
				sendResponseElement.style.height = (window.innerHeight - sendResponseElement.offsetTop - 40) + 'px';
			}
		}

		function waitCursor(On)
		{
			if (On)
			{
				busyi.show();
			}
			else
			{
				busyi.hide();
			}
		}
	</script>

</body>

</html>
